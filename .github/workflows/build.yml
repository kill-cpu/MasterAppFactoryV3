name: MasterAppFactoryV3 Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the App'
        required: true
        default: 'MyAIApp'
      prompt:
        description: 'Generation Prompt'
        required: true
        default: 'Create a simple hello world app'
  repository_dispatch:
    types: [trigger_build]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Parse Inputs and Run AI Builder Orchestrator
      env:
        APP_NAME: ${{ github.event.inputs.app_name || github.event.client_payload.app_name }}
        PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
      run: |
        echo "Processing App Name: $APP_NAME"
        echo "Processing Prompt: $PROMPT"
        python scripts/ai_builder.py --name "$APP_NAME" --prompt "$PROMPT"

    # Yeh step pure Gradle environment ko automatic setup aur cache karega
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    # Agar gradlew file nahi bhi hai, toh hum direct global gradle command se build karenge
    - name: Build Debug APK via Gradle
      run: |
        cd android-template
        gradle assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name || github.event.client_payload.app_name }}-APK
        path: android-template/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
